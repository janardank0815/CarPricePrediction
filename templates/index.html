<!DOCTYPE html>
<html>
<head>
    <title>Car Price Predictor</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family:Arial,sans-serif;
            background:linear-gradient(135deg,#1e3c72,#2a5298);
            color:white;
            text-align:center;
        }

        .container{
            width:450px;
            margin:40px auto;
            background:white;
            color:black;
            padding:30px;
            border-radius:20px;
            box-shadow:0 8px 25px rgba(0,0,0,0.25);
        }

        h1{
            margin-bottom:20px;
        }

        select,input,button{
            width:90%;
            padding:12px;
            margin:10px 0;
            border-radius:10px;
            border:1px solid #ccc;
            font-size:16px;
        }

        button{
            background:#28a745;
            color:white;
            border:none;
            cursor:pointer;
        }

        button:hover{
            background:#218838;
        }

        .result{
            margin-top:20px;
            padding:15px;
            background:#f8f9fa;
            border-radius:12px;
        }

        .error{
            color:red;
            font-weight:bold;
            margin-top:15px;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>🚗 Car Price Predictor</h1>

    <form action="/predict" method="POST">

        <select
            id="brand"
            name="brand"
            onchange="updateModels()"
            required>

            <option value="">Select Brand</option>
            <option value="Maruti">Maruti</option>
            <option value="Hyundai">Hyundai</option>
            <option value="Honda">Honda</option>
            <option value="Tata">Tata</option>
            <option value="Mahindra">Mahindra</option>

        </select>


        <select
            id="model"
            name="model"
            onchange="updateCarDetails()"
            required>

            <option value="">Select Model</option>

        </select>


        <input
            type="number"
            id="launch_year"
            name="launch_year"
            placeholder="Launch Year"
            readonly
            required>


        <input
            type="number"
            id="launch_price"
            name="launch_price"
            placeholder="Original Price"
            readonly
            required>


        <input
            type="number"
            name="km_driven"
            placeholder="KM Driven"
            required>


        <button type="submit">
            Predict Current Price
        </button>

    </form>


    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}


    {% if prediction_text %}
    <div class="result">

        <h2>
            Estimated Price: ₹ {{ prediction_text }}
        </h2>

        <h3>
            Original Price: ₹ {{ launch_price }}
        </h3>

        <h3>
            Depreciation: {{ depreciation }}%
        </h3>

    </div>
    {% endif %}

</div>

<script>

const carData = {

    Maruti: {
        Swift: { price: 700000, year: 2018 },
        Baleno: { price: 850000, year: 2019 },
        Brezza: { price: 950000, year: 2020 }
    },

    Hyundai: {
        i20: { price: 800000, year: 2018 },
        Creta: { price: 1400000, year: 2020 },
        Venue: { price: 1100000, year: 2021 }
    },

    Honda: {
        City: { price: 1100000, year: 2017 },
        Amaze: { price: 850000, year: 2019 }
    },

    Tata: {
        Nexon: { price: 1200000, year: 2021 },
        Punch: { price: 900000, year: 2022 }
    },

    Mahindra: {
        Scorpio: { price: 1600000, year: 2018 },
        XUV300: { price: 1300000, year: 2020 },
        "Thar Roxx": { price: 1850000, year: 2024 }
    }

};


function updateModels(){

    let brand =
    document.getElementById("brand").value;

    let modelDropdown =
    document.getElementById("model");

    modelDropdown.innerHTML =
    '<option value="">Select Model</option>';

    for(let model in carData[brand]){

        let option =
        document.createElement("option");

        option.value = model;
        option.text = model;

        modelDropdown.add(option);
    }

    document.getElementById("launch_year").value = "";
    document.getElementById("launch_price").value = "";
}


function updateCarDetails(){

    let brand =
    document.getElementById("brand").value;

    let model =
    document.getElementById("model").value;

    let selectedCar =
    carData[brand][model];

    document.getElementById("launch_year").value =
    selectedCar.year;

    document.getElementById("launch_price").value =
    selectedCar.price;
}

</script>

</body>
</html>
